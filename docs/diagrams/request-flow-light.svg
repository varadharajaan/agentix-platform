  <text x="920" y="198" text-anchor="middle" class="flow-label">invoke</text>
  <path class="edge" stroke="#0891B2" marker-end="url(#ar-cyan-light)" d="M1170 206 H1230"/>
  <text x="1200" y="198" text-anchor="middle" class="flow-label">LLM·MCP</text>
  <path class="edge" stroke="#E11D48" marker-end="url(#ar-rose-light)" d="M1450 206 H1510"/>
  <text x="1480" y="198" text-anchor="middle" class="flow-label">TLS</text>
  <rect x="950" y="408" width="220" height="92" rx="10" class="box" stroke="rgba(5,150,105,0.45)"/>
  <rect x="950" y="408" width="3.5" height="92" rx="1.75" fill="#059669"/>
  <text x="970" y="438" class="box-title">Agent Memory</text>
  <text x="970" y="464" class="box-sub">MongoDB Atlas</text>
  <text x="970" y="485" class="box-sub">vector recall</text>
  <rect x="1230" y="408" width="220" height="92" rx="10" class="box" stroke="rgba(5,150,105,0.45)"/>
  <rect x="1230" y="408" width="3.5" height="92" rx="1.75" fill="#059669"/>
  <text x="1250" y="438" class="box-title">MCP Tool Servers</text>
  <text x="1250" y="464" class="box-sub">via gateway</text>
  <text x="1250" y="485" class="box-sub">no tool credentials</text>
  <path class="edge" stroke="#059669" marker-end="url(#ar-emerald-light)" d="M1060 260 V408"/>
  <text x="1072" y="340" class="flow-label">memory r/w</text>
  <path class="edge" stroke="#059669" marker-end="url(#ar-emerald-light)" d="M1340 260 V408"/>
