  <rect x="110" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(37,99,235,0.45)"/>
  <rect x="110" y="152" width="3.5" height="108" rx="1.75" fill="#2563EB"/>
  <text x="130" y="186" class="box-title">Client</text>
  <text x="130" y="212" class="box-sub">A2A tasks/send</text>
  <text x="130" y="233" class="box-sub">HTTPS · JWT</text>
  <circle cx="500" cy="126" r="15" class="chip" stroke="#0891B2"/>
