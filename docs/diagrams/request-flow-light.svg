      <path d="M0 0L10 5L0 10z" fill="#E11D48"/>
    </marker>
    <marker id="ar-slate-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 18px; fill: #55617A; }
      .band-label { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .box { fill: rgba(255,255,255,0.78); stroke-width: 1; }
      .box-title { font-size: 19px; font-weight: 600; fill: #17203A; }
      .box-sub { font-size: 15px; fill: #4A5872; }
      .edge { fill: none; stroke-width: 1.6; }
      .edge-label { font-size: 14px; fill: #66748C; }
      .junction { fill: #059669; }
      .mod-title { font-size: 19px; font-weight: 600; fill: #3B2E6E; }
      .chip { fill: #FFFFFF; stroke-width: 1.4; }
      .chip-num { font-size: 16px; font-weight: 700; fill: #17203A; }
      .flow-label { font-size: 13px; fill: #66748C; }
