  <rect x="390" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(8,145,178,0.45)"/>
  <rect x="390" y="152" width="3.5" height="108" rx="1.75" fill="#0891B2"/>
  <text x="410" y="186" class="box-title">Ingress Gateway</text>
  <text x="410" y="212" class="box-sub">verify JWT (JWKS)</text>
  <text x="410" y="233" class="box-sub">route /a2a/{ns}/{agent}</text>
  <circle cx="780" cy="126" r="15" class="chip" stroke="#0891B2"/>
  <text x="780" y="131.5" text-anchor="middle" class="chip-num">3</text>
  <rect x="670" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(8,145,178,0.45)"/>
  <rect x="670" y="152" width="3.5" height="108" rx="1.75" fill="#0891B2"/>
  <text x="690" y="186" class="box-title">Tenant Waypoint</text>
  <text x="690" y="212" class="box-sub">L7 policy · HBONE mTLS</text>
  <text x="690" y="233" class="box-sub">namespace isolation</text>
  <circle cx="1060" cy="126" r="15" class="chip" stroke="#7C3AED"/>
  <text x="1060" y="131.5" text-anchor="middle" class="chip-num">4</text>
  <rect x="950" y="152" width="220" height="108" rx="12" fill="rgba(255,255,255,0.85)" stroke="url(#synGrad-light)" stroke-width="2" filter="url(#softGlow-light)"/>
  <text x="970" y="186" class="box-title">Synapse Agent</text>
  <text x="970" y="212" class="box-sub">LangGraph loop</text>
  <text x="970" y="233" class="box-sub">plan · act · observe</text>
  <circle cx="1340" cy="126" r="15" class="chip" stroke="#0891B2"/>
  <text x="1340" y="131.5" text-anchor="middle" class="chip-num">5</text>
  <rect x="1230" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(8,145,178,0.45)"/>
  <rect x="1230" y="152" width="3.5" height="108" rx="1.75" fill="#0891B2"/>
  <text x="1250" y="186" class="box-title">Egress Gateway</text>
  <text x="1250" y="212" class="box-sub">injects real API key</text>
  <text x="1250" y="233" class="box-sub">prompt guards · PII</text>
  <circle cx="1620" cy="126" r="15" class="chip" stroke="#E11D48"/>
  <text x="1620" y="131.5" text-anchor="middle" class="chip-num">6</text>
  <rect x="1510" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(225,29,72,0.45)"/>
  <rect x="1510" y="152" width="3.5" height="108" rx="1.75" fill="#E11D48"/>
  <text x="1530" y="186" class="box-title">LLM Provider</text>
  <text x="1530" y="212" class="box-sub">Anthropic · OpenAI</text>
  <text x="1530" y="233" class="box-sub">completion</text>
  <path class="edge" stroke="#2563EB" marker-end="url(#ar-blue-light)" d="M330 206 H390"/>
  <text x="360" y="198" text-anchor="middle" class="flow-label">HTTPS</text>
