  <rect width="1840" height="700" rx="18" fill="url(#bgGrad-light)"/>
  <text x="60" y="48" style="font-size:28px; font-weight:700; fill:#17203A;">One request through the platform</text>
  <text x="60" y="78" class="subtitle">A2A in → LangGraph reasoning loop → governed LLM egress — with memory and tracing on the side channels</text>
