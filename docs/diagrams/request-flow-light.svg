  <rect x="110" y="528" width="1620" height="88" rx="10" class="box" stroke="rgba(5,150,105,0.45)"/>
  <rect x="110" y="528" width="3.5" height="88" rx="1.75" fill="#059669"/>
  <text x="130" y="562" class="box-title">Tracing — LangSmith · Phoenix · Langfuse (OTEL)</text>
  <text x="130" y="588" class="box-sub">every span: gateway · agent · tool · LLM — cost, latency, prompts, tokens</text>
  <path class="edge" stroke="#059669" stroke-dasharray="5 4" marker-end="url(#ar-emerald-light)" d="M500 260 V528"/>
  <path class="edge" stroke="#059669" stroke-dasharray="5 4" marker-end="url(#ar-emerald-light)" d="M1010 260 V292 H760 V528"/>
  <path class="edge" stroke="#059669" stroke-dasharray="5 4" marker-end="url(#ar-emerald-light)" d="M1400 260 V300 H1560 V528"/>
  <text x="920" y="662" text-anchor="middle" class="edge-label" fill="#8A94A8">Every hop traced · every credential injected at the proxy · every tenant isolated</text>
</svg>
