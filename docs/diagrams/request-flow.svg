  <text x="970" y="212" class="box-sub">LangGraph loop</text>
  <text x="970" y="233" class="box-sub">plan · act · observe</text>
  <circle cx="1340" cy="126" r="15" class="chip" stroke="#22D3EE"/>
  <text x="1340" y="131.5" text-anchor="middle" class="chip-num">5</text>
  <rect x="1230" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(34,211,238,0.35)"/>
  <rect x="1230" y="152" width="3.5" height="108" rx="1.75" fill="#22D3EE"/>
