  <path class="edge" stroke="#34D399" stroke-dasharray="5 4" marker-end="url(#ar-emerald-dark)" d="M1010 260 V292 H760 V528"/>
  <path class="edge" stroke="#34D399" stroke-dasharray="5 4" marker-end="url(#ar-emerald-dark)" d="M1400 260 V300 H1560 V528"/>
  <text x="920" y="662" text-anchor="middle" class="edge-label" fill="#5F6E86">Every hop traced · every credential injected at the proxy · every tenant isolated</text>
