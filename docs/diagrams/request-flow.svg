  <text x="1250" y="212" class="box-sub">injects real API key</text>
  <text x="1250" y="233" class="box-sub">prompt guards · PII</text>
  <circle cx="1620" cy="126" r="15" class="chip" stroke="#FB7185"/>
  <text x="1620" y="131.5" text-anchor="middle" class="chip-num">6</text>
  <rect x="1510" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(251,113,133,0.35)"/>
