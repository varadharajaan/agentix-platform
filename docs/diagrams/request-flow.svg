  <text x="410" y="233" class="box-sub">route /a2a/{ns}/{agent}</text>
  <circle cx="780" cy="126" r="15" class="chip" stroke="#22D3EE"/>
  <text x="780" y="131.5" text-anchor="middle" class="chip-num">3</text>
  <rect x="670" y="152" width="220" height="108" rx="12" class="box" stroke="rgba(34,211,238,0.35)"/>
  <rect x="670" y="152" width="3.5" height="108" rx="1.75" fill="#22D3EE"/>
